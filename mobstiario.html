<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minedex - Bestiario de Mobs</title>
    <!--Framework CDN: Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <!--CSS Personalizado -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="has-background-light">

    <nav class="barra-navegacion">

            <button class="btn-hamburguesa" aria-label="Abrir menú de navegación" onclick="abrirMenu()">☰</button>
            
            <!-- Botones de Sesión a la derecha-->
            <div class="botones-sesion">
                <a href="login.html" class="btn-sesion">Iniciar Sesión</a>
                <a href="registro.html" class="btn-registro">Registrarse</a>
            </div>

            <!-- Menú oculto que saldrá desde la derecha -->
            <div class="menu-enlaces" id="menu">
                <a href="minecraft.html">🏠 Inicio</a>
                <a href="productos.html">⚔️ Productos</a>
                <a href="nosotros.html">🥖 Nosotros</a>
                <a href="blog.html">📰 Blog</a>
                <a href="contacto.html">✉️ Contacto</a>
                <a href="mobstiario.html">📖 Mobstiario</a>
            </div>

      </nav>

    <section class="section">
        <div class="container">
            
            <h1 class="title has-text-centered titulo-fluido">MineDex: Registro de Mobs</h1>
            
            <div class="columns is-desktop">
                <!-- Formulario -->
                <div class="column is-one-third">
                    <div class="box form-container">
                        <h2 class="subtitle is-4">Añadir Nuevo Mob</h2>
                        <form id="form-mob">
                            <div class="field">
                                <label class="label">Nombre del Mob</label>
                                <div class="control">
                                    <input class="input" type="text" id="input-nombre" placeholder="Ej. Creeper" required>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">Dimensión de Origen</label>
                                <div class="control">
                                    <input class="input" type="text" id="input-origen" placeholder="Ej. Overworld" required>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">Rol / Comportamiento</label>
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select id="input-rol">
                                            <option value="Hostil">Hostil</option>
                                            <option value="Neutral">Neutral</option>
                                            <option value="Pacífico">Pacífico</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="field">
                                <label class="label">URL de la Imagen</label>
                                <div class="control">
                                    <input class="input" type="url" id="input-imagen" placeholder="https://..." required>
                                </div>
                            </div>
                            <button type="submit" class="button is-success is-fullwidth">Registrar Mob</button>
                        </form>
                    </div>
                </div>

                <!-- Grilla de Tarjetas y Buscador -->
                <div class="column is-two-thirds">

                    <div class="field">
                        <div class="control">
                            <input class="input is-medium is-rounded" type="text" id="buscador" placeholder="🔍 Buscar mob por nombre...">
                        </div>
                    </div>

                    <!-- Contenedor de la Grilla-->
                    <div class="columns is-multiline" id="catalogo-mobs">

                    </div>
                </div>
            </div>
        </div>
    </section>

    <!--Pie de pagina-->
  <footer class="footer has-background-dark has-text-white has-text-centered">
    <p>&copy; 2026 MineShop. Todos los derechos reservados.</p>
    <p>Contacto: contacto@mineshop.com</p>
  </footer>

    <script src="js/script.js"></script>
    <script src="js/minedex.js"></script>
    
</body>
</html>
